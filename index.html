      // ---- Robust Spanish TTS ----
      function speakES(text){
        try{
          if(!('speechSynthesis' in window)) return;
          const synth = window.speechSynthesis;
          const speakNow = () => {
            const voices = synth.getVoices();
            const pick = voices.find(v=>/es-AR/i.test(v.lang))
              || voices.find(v=>/es-ES/i.test(v.lang))
              || voices.find(v=>/es-MX/i.test(v.lang))
              || voices.find(v=>/^es(-|_)?/i.test(v.lang));
            const u = new SpeechSynthesisUtterance(text);
            if (pick) { u.voice = pick; u.lang = pick.lang; } else { u.lang = 'es-AR'; }
            u.rate = 1;
            synth.speak(u);
          };
          if(!synth.getVoices().length){
            synth.onvoiceschanged = () => { speakNow(); synth.onvoiceschanged = null; };
          } else {
            speakNow();
          }
        }catch(e){}
      }

      // ---- IndexedDB (Dexie) ----
      const db = new Dexie('lunfardo_srs_full_en');
      db.version(1).stores({
        cards: '++id, es, en, cats',
        srs: '&cardId, ease, interval, reps, lapses, due, state, stepIndex',
        meta: '&key',
        logs: '++id, ts, cardId, action, quality'
      });

      // ---- Config ----
      const DEFAULTS = {
        learningStepsMins: [1, 10], // e.g., 1m then 10m
        dailyNewLimit: 15,
        dailyReviewLimit: 100
      };

      async function seedIfNeeded(){
        const seeded = await db.meta.get('seeded');
        if (!seeded){
          const count = await db.cards.count();
          if (count === 0) {
            await db.cards.bulkAdd(DATA.map(x => ({...x})));
            const all = await db.cards.toArray();
            await db.srs.bulkPut(all.map(c => ({
              cardId: c.id, ease:2.5, interval:0, reps:0, lapses:0,
              due: Date.now(), state:'new', stepIndex:0
            })));
          }
          // init counters date
          await db.meta.put({ key:'day', value: new Date().toDateString() });
          await db.meta.put({ key:'newDone', value: 0 });
          await db.meta.put({ key:'reviewDone', value: 0 });
          await db.meta.put({ key:'learningStepsMins', value: DEFAULTS.learningStepsMins });
          await db.meta.put({ key:'dailyNewLimit', value: DEFAULTS.dailyNewLimit });
          await db.meta.put({ key:'dailyReviewLimit', value: DEFAULTS.dailyReviewLimit });
          await db.meta.put({ key:'seeded', value:true });
        }
      }

      // ---- Helpers for daily counters ----
      async function ensureDay(){
        const today = new Date().toDateString();
        const day = await db.meta.get('day');
        if (!day || day.value !== today){
          await db.meta.put({ key:'day', value: today });
          await db.meta.put({ key:'newDone', value: 0 });
          await db.meta.put({ key:'reviewDone', value: 0 });
        }
      }
      async function incCounter(which){
        await ensureDay();
        const cur = await db.meta.get(which);
        await db.meta.put({ key: which, value: (cur?.value || 0) + 1 });
      }
      async function getCounters(){
        await ensureDay();
        const [n, r, steps, nLim, rLim] = await Promise.all([
          db.meta.get('newDone'), db.meta.get('reviewDone'),
          db.meta.get('learningStepsMins'),
          db.meta.get('dailyNewLimit'), db.meta.get('dailyReviewLimit')
        ]);
        return {
          newDone: n?.value || 0,
          reviewDone: r?.value || 0,
          learningStepsMins: steps?.value || DEFAULTS.learningStepsMins,
          dailyNewLimit: nLim?.value ?? DEFAULTS.dailyNewLimit,
          dailyReviewLimit: rLim?.value ?? DEFAULTS.dailyReviewLimit
        };
      }

      // ---- SM-2 simplified ----
      function sm2Update(stats, quality){
        let { ease=2.5, interval=0, reps=0, lapses=0 } = stats || {};
        if (quality < 3){
          reps = 0;
          lapses += 1;
          interval = 1;
        } else {
          if (reps === 0) interval = 1;
          else if (reps === 1) interval = 6;
          else interval = Math.round(interval * ease);
          reps += 1;
        }
        ease = ease + (0.1 - (4 - quality) * (0.08 + (4 - quality) * 0.02));
        if (ease < 1.3) ease = 1.3;
        const due = Date.now() + interval * 24 * 60 * 60 * 1000;
        return { ease, interval, reps, lapses, due };
      }

      function minutesFromNow(min){ return Date.now() + min*60*1000; }

      // ---- LocalStorage hook ----
      function useLocalStorage(key, def){
        const [st,setSt] = useState(()=>{
          try{ const v = localStorage.getItem(key); return v? JSON.parse(v): def; } catch { return def; }
        });
        useEffect(()=>{ try{ localStorage.setItem(key, JSON.stringify(st)); } catch {} }, [key, st]);
        return [st,setSt];
      }

      const Badge = ({children}) => <span className="inline-block px-2 py-0.5 text-xs rounded-full bg-gray-100 border">{children}</span>;

      function Card({ item, showBack, onFlip }){

              <div className="text-sm text-gray-500">{showBack? 'Meaning' : 'Lunfardo'}</div>
              <div className="flex gap-2">{(item.cats||[]).slice(0,3).map(c=> <Badge key={c}>{c}</Badge>)}</div>
            </div>
            {!showBack ? (
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <div className="text-3xl font-semibold">{item.es}</div>
                  <button onClick={()=>speakES(item.es)} title="Listen (ES)" className="px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200">🔊</button>
                </div>
                {item.note && <div className="text-sm text-gray-600">{item.note}</div>}
              </div>
            ) : (
              <div className="space-y-3">
                <div className="text-2xl font-semibold">{item.en}</div>
                <div className="mt-2 p-3 rounded-xl bg-gray-50 border">
                  <div className="text-sm text-gray-500 mb-1">Example</div>
                  <div className="font-medium">ES: {item.exEs || '—'}</div>
                  <div className="opacity-80">EN: {item.exEn || '—'}</div>
                </div>
              </div>
            )}
            <div className="mt-4 flex gap-2">
              <button onClick={onFlip} className="px-4 py-2 rounded-xl shadow bg-blue-600 text-white">{showBack? 'Show front' : 'Show meaning'}</button>
            </div>
          </div>
        );
      }

      function CategoryBar({ activeCats, setActiveCats }){
        const allOn = ()=> setActiveCats(CATS.map(c=>c.id));
        const allOff = ()=> setActiveCats([]);
        const toggleCat = (id)=> setActiveCats(acs => acs.includes(id) ? acs.filter(x=>x!==id) : [...acs, id]);
        return (
          <div className="mt-3 flex flex-wrap gap-2 items-center">
            <button onClick={allOn}  className="px-3 py-1 rounded-full border bg-gray-50">All</button>
            <button onClick={allOff} className="px-3 py-1 rounded-full border bg-gray-50">None</button>
            {CATS.map(c => (
              <button key={c.id} onClick={()=>toggleCat(c.id)} className={`px-3 py-1 rounded-full border ${activeCats.includes(c.id)?'bg-blue-100':'bg-white'}`}>{c.label}</button>
            ))}
          </div>
        );
      }

      // ---- Study (with limits & steps) ----
      function useQueue(activeCats){
        const [queue, setQueue] = useState({ review:[], learning:[], new:[] });
        const [counters, setCounters] = useState({ newDone:0, reviewDone:0, learningStepsMins:DEFAULTS.learningStepsMins, dailyNewLimit:DEFAULTS.dailyNewLimit, dailyReviewLimit:DEFAULTS.dailyReviewLimit });

        const refresh = async ()=>{
          const now = Date.now();
          const { newDone, reviewDone, learningStepsMins, dailyNewLimit, dailyReviewLimit } = await getCounters();

          // fetch candidates
          const srsAll = await db.srs.toArray();
          const cardsAll = await db.cards.toArray();
          const cardById = Object.fromEntries(cardsAll.map(c=>[c.id,c]));

          const filtered = srsAll.filter(s => {
            const c = cardById[s.cardId]; if(!c) return false;
            return (c.cats||[]).some(cat => activeCats.includes(cat));
          });

          // partition
          const review = filtered.filter(s => s.state==='review' && s.due <= now).sort((a,b)=>a.due-b.due);
          const learning = filtered.filter(s => s.state==='learning' && s.due <= now).sort((a,b)=>a.due-b.due);
          const newOnes = filtered.filter(s => s.state==='new').sort((a,b)=>a.cardId-b.cardId);

          // apply limits (priority: review -> learning -> new)
          const reviewAllowed = Math.max(0, dailyReviewLimit - reviewDone);
          const reviewQ = review.slice(0, reviewAllowed);
          const newAllowed = Math.max(0, dailyNewLimit - newDone);
          const newQ = newOnes.slice(0, newAllowed);

          setQueue({ review:reviewQ, learning, new:newQ });
          setCounters({ newDone, reviewDone, learningStepsMins, dailyNewLimit, dailyReviewLimit });
        };

        useEffect(()=>{ refresh(); }, [activeCats.join('|')]);
        return { queue, counters, refresh };
      }

      function StudyTab({ activeCats }){
        const { queue, counters, refresh } = useQueue(activeCats);
        const [pair, setPair] = useState(null);
        const [show, setShow] = useState(false);

        useEffect(()=>{
          (async ()=>{
            // pick priority: review -> learning -> new
            const s = queue.review[0] || queue.learning[0] || queue.new[0] || null;
            if (!s){ setPair(null); return; }
            const c = await db.cards.get(s.cardId);
            setPair({ s, c });
            setShow(false);
          })();
        }, [queue]);

        const rateLearning = async (s, quality) => {
          const { learningStepsMins } = counters;
          if (quality < 3){
            // again: reset steps to first
            await db.srs.update(s.cardId, { stepIndex:0, due: minutesFromNow(learningStepsMins[0]) });
          } else {
            // good/easy: advance step or graduate
            const nextIdx = (s.stepIndex || 0) + 1;
            if (nextIdx < learningStepsMins.length){
              await db.srs.update(s.cardId, { stepIndex: nextIdx, due: minutesFromNow(learningStepsMins[nextIdx]) });
            } else {
              // graduate to review
              const updated = sm2Update({ ease: 2.5, interval:0, reps:0, lapses:s.lapses || 0 }, quality>=4?4:3);
              await db.srs.update(s.cardId, { ...updated, state:'review', stepIndex:0 });
              await incCounter('newDone'); // count graduation as learned today
            }
          }
          await db.logs.add({ ts:Date.now(), cardId:s.cardId, action:'learning', quality });
          await refresh();
        };

        const rateReview = async (s, quality) => {
          const updated = sm2Update(s, quality);
          await db.srs.update(s.cardId, { ...updated, state:'review', stepIndex:0 });
          await incCounter('reviewDone');
          await db.logs.add({ ts:Date.now(), cardId:s.cardId, action:'review', quality });
          await refresh();
        };

        const rateNew = async (s, quality) => {
          // move to learning, first step
          const { learningStepsMins } = counters;
          const due = minutesFromNow(learningStepsMins[0]);
          await db.srs.update(s.cardId, { state:'learning', stepIndex:0, due });
          await db.logs.add({ ts:Date.now(), cardId:s.cardId, action:'startLearning', quality });
          await refresh();
        };

        const onRate = async (q) => {
          if (!pair) return;
          if (pair.s.state === 'review') await rateReview(pair.s, q);
          else if (pair.s.state === 'learning') await rateLearning(pair.s, q);
          else if (pair.s.state === 'new') await rateNew(pair.s, q);
        };

        if (!pair){
          return (
            <div className="rounded-2xl border bg-white p-6 text-center text-gray-700">
              <div className="text-xl font-semibold mb-1">No due cards for the current filter</div>
              <div className="text-sm">Increase daily limits or enable more categories.</div>
              <DailyControls counters={counters} refresh={refresh} />
            </div>
          );
        }

        return (
          <div className="space-y-4">
            <DailyControls counters={counters} refresh={refresh} />

            <div className="rounded-2xl border bg-white p-6 shadow">
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm text-gray-500">
                  Queue — Review: {queue.review.length} • Learning: {queue.learning.length} • New: {queue.new.length}
                </div>
                <button onClick={()=>speakES(pair.c.es)} className="px-3 py-1 rounded-lg border bg-gray-50" title="Listen (ES)">🔊</button>
              </div>

              <div className="text-xs text-gray-500 mb-1">State: {pair.s.state}</div>
              <div className="text-3xl font-semibold">{pair.c.es}</div>

              {!show ? (
                <div className="mt-6">
                  <button onClick={()=>setShow(true)} className="px-4 py-2 rounded-xl bg-blue-600 text-white">Show answer</button>
                </div>
              ) : (
                <div className="mt-4 space-y-3">
                  <div className="text-2xl">{pair.c.en}</div>
                  <div className="p-3 rounded-xl bg-gray-50 border">
                    <div className="text-sm text-gray-500 mb-1">Example</div>
                    <div className="font-medium">ES: {pair.c.exEs || '—'}</div>
                    <div className="opacity-80">EN: {pair.c.exEn || '—'}</div>
                  </div>

                  <div className="mt-2 grid grid-cols-2 md:grid-cols-4 gap-2">
                    <button onClick={()=>onRate(1)} className="px-3 py-2 rounded-xl border bg-red-50">Again</button>
                    <button onClick={()=>onRate(2)} className="px-3 py-2 rounded-xl border bg-yellow-50">Hard</button>
                    <button onClick={()=>onRate(3)} className="px-3 py-2 rounded-xl border bg-green-50">Good</button>
                    <button onClick={()=>onRate(4)} className="px-3 py-2 rounded-xl border bg-blue-50">Easy</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      function DailyControls({ counters, refresh }){
        const [editing, setEditing] = useState(false);
        const [newLimit, setNewLimit] = useState(counters.dailyNewLimit);
        const [reviewLimit, setReviewLimit] = useState(counters.dailyReviewLimit);
        const [steps, setSteps] = useState((counters.learningStepsMins || []).join(','));

        useEffect(()=>{
          setNewLimit(counters.dailyNewLimit);
          setReviewLimit(counters.dailyReviewLimit);
          setSteps((counters.learningStepsMins || []).join(','));
        }, [counters]);

        const save = async () => {
          const arr = steps.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>=1);
          await db.meta.put({ key:'dailyNewLimit', value: parseInt(newLimit,10) || 15 });
          await db.meta.put({ key:'dailyReviewLimit', value: parseInt(reviewLimit,10) || 100 });
          await db.meta.put({ key:'learningStepsMins', value: arr.length?arr:[1,10] });
          setEditing(false);
          await refresh();
        };

        return (
          <div className="rounded-2xl border bg-white p-4 shadow">
            {!editing ? (
              <div className="flex flex-wrap items-center gap-4 text-sm">
                <div>New today: <b>{counters.newDone}</b> / {counters.dailyNewLimit}</div>
                <div>Reviews today: <b>{counters.reviewDone}</b> / {counters.dailyReviewLimit}</div>
                <div>Learning steps (min): <b>{(counters.learningStepsMins||[]).join(', ')}</b></div>
                <button onClick={()=>setEditing(true)} className="ml-auto px-3 py-1 rounded-lg border bg-gray-50">Edit limits</button>
              </div>
            ) : (
              <div className="flex flex-col md:flex-row gap-3 md:items-end">
                <label className="text-sm">Daily limit (New)
                  <input type="number" className="block w-32 px-3 py-1 rounded-lg border" value={newLimit} onChange={e=>setNewLimit(e.target.value)} />
                </label>
                <label className="text-sm">Daily limit (Review)
                  <input type="number" className="block w-32 px-3 py-1 rounded-lg border" value={reviewLimit} onChange={e=>setReviewLimit(e.target.value)} />
                </label>
                <label className="text-sm">Learning steps (min, comma)
                  <input type="text" className="block w-48 px-3 py-1 rounded-lg border" value={steps} onChange={e=>setSteps(e.target.value)} />
                </label>
                <div className="flex gap-2">
                  <button onClick={save} className="px-3 py-1 rounded-lg bg-blue-600 text-white">Save</button>
                  <button onClick={()=>setEditing(false)} className="px-3 py-1 rounded-lg border bg-gray-50">Cancel</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ---- Browse (non-SRS) ----
      function BrowseTab({ activeCats }){
        const [query, setQuery] = useLocalStorage('lunf_q','');
        const [index, setIndex] = useLocalStorage('lunf_idx', 0);
        const [back, setBack] = useLocalStorage('lunf_back', false);
        const [list, setList] = useState([]);

        useEffect(()=>{
          (async()=>{
            const all = await db.cards.toArray();
            let arr = all.filter(d => (d.cats||[]).some(c=>activeCats.includes(c)));
            const q = query.trim().toLowerCase();
            if(q){
              arr = arr.filter(d =>
                (d.es||'').toLowerCase().includes(q) ||
                (d.en||'').toLowerCase().includes(q) ||
                (d.exEs||'').toLowerCase().includes(q) ||
                (d.exEn||'').toLowerCase().includes(q)
              );
            }
            setList(arr);
          })();
        },[activeCats.join('|'), query]);

        useEffect(()=>{ if(index>=list.length) setIndex(0); },[list.length]);

        const current = list[index];
        const flip   = ()=> setBack(b=>!b);
        const next   = ()=>{ setBack(false); setIndex( (index+1) % (list.length || 1) ); };
        const prev   = ()=>{ setBack(false); setIndex( (index-1 + (list.length||1)) % (list.length||1) ); };
        const shuffleNow = ()=>{ setBack(false); setIndex(Math.floor(Math.random() * (list.length||1))); };

        return (
          <div className="space-y-3">
            <div className="rounded-2xl border bg-white p-4 md:p-6 shadow">
              <div className="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search: 'boludo', 'mate', 'money'…" className="w-full md:w-96 px-3 py-2 rounded-xl border"/>
                <div className="text-sm text-gray-600">{list.length} cards • {Math.min(index+1, Math.max(list.length,1))}/{Math.max(list.length,1)}</div>
              </div>
              <div className="mt-3 flex flex-wrap gap-2 items-center">
                <button onClick={shuffleNow} className="px-3 py-1 rounded-full border bg-gray-50">Shuffle</button>
              </div>
            </div>

            {current ? (
              <>
                <Card item={current} showBack={back} onFlip={flip} />
                <div className="mt-4 flex items-center gap-2 justify-center">
                  <button onClick={prev} className="px-4 py-2 rounded-xl bg-gray-100 border">⟵ Previous</button>
                  <button onClick={flip} className="px-4 py-2 rounded-xl bg-blue-600 text-white">Flip</button>
                  <button onClick={next} className="px-4 py-2 rounded-xl bg-gray-100 border">Next ⟶</button>
                  <button onClick={()=>current && speakES(current.es)} className="px-4 py-2 rounded-xl bg-gray-100 border" title="Listen (ES)">🔊</button>
                </div>
              </>
            ) : (
              <div className="p-6 rounded-2xl border bg-white text-gray-600">No cards match these filters.</div>
            )}
          </div>
        );
      }

      // ---- Manage (add/import/export) ----
      function ManageTab({ onChange }){
        const [form, setForm] = useState({ es:'', en:'', exEs:'', exEn:'', cats:'', note:'' });
        const [list, setList] = useState([]);

        const refreshList = async ()=> setList(await db.cards.toArray());
        useEffect(()=>{ refreshList(); }, []);

        const add = async () => {
          if (!form.es || !form.en) return;
          const item = {
            es: form.es.trim(), en: form.en.trim(),
            exEs: form.exEs.trim() || '', exEn: form.exEn.trim() || '',
            note: form.note.trim() || '',
            cats: form.cats.split(',').map(s=>s.trim()).filter(Boolean)
          };
          const id = await db.cards.add(item);
          await db.srs.put({ cardId:id, ease:2.5, interval:0, reps:0, lapses:0, due:Date.now(), state:'new', stepIndex:0 });
          setForm({ es:'', en:'', exEs:'', exEn:'', cats:'', note:'' });
          await refreshList();
          onChange?.();
        };

        const del = async (id) => {
          await db.cards.delete(id);
          await db.srs.delete(id);
          await refreshList();
          onChange?.();
        };

        const exportJSON = async () => {
          const all = await db.cards.toArray();
          const blob = new Blob([JSON.stringify(all, null, 2)], {type:'application/json'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'lunfardo_deck_export.json'; a.click();
          URL.revokeObjectURL(url);
        };

        const importJSON = async (file) => {
          if(!file) return;
          const text = await file.text();
          const arr = JSON.parse(text);
          if(Array.isArray(arr)){
            await db.cards.clear();
            await db.srs.clear();
            await db.cards.bulkAdd(arr.map(x=>({...x, id: undefined})));
            const all = await db.cards.toArray();
            await db.srs.bulkPut(all.map(c => ({ cardId:c.id, ease:2.5, interval:0, reps:0, lapses:0, due:Date.now(), state:'new', stepIndex:0 })));
            await refreshList();
            onChange?.();
          }
        };

        const resetDB = async () => {
          if (!confirm('Reset and reseed with the default deck?')) return;
          await db.cards.clear();
          await db.srs.clear();
          await db.cards.bulkAdd(DATA.map(x => ({...x})));
          const all = await db.cards.toArray();
          await db.srs.bulkPut(all.map(c => ({ cardId:c.id, ease:2.5, interval:0, reps:0, lapses:0, due:Date.now(), state:'new', stepIndex:0 })));
          await refreshList();
          onChange?.();
        };

        return (
          <div className="space-y-4">
            <div className="rounded-2xl border bg-white p-5 shadow space-y-3">
              <div className="font-semibold">Add card</div>
              <div className="grid md:grid-cols-2 gap-3">
                <input className="px-3 py-2 rounded-xl border" placeholder="ES (slang)" value={form.es} onChange={e=>setForm({...form, es:e.target.value})}/>
                <input className="px-3 py-2 rounded-xl border" placeholder="EN (meaning)" value={form.en} onChange={e=>setForm({...form, en:e.target.value})}/>
                <input className="px-3 py-2 rounded-xl border" placeholder="Example ES" value={form.exEs} onChange={e=>setForm({...form, exEs:e.target.value})}/>
                <input className="px-3 py-2 rounded-xl border" placeholder="Example EN" value={form.exEn} onChange={e=>setForm({...form, exEn:e.target.value})}/>
                <input className="px-3 py-2 rounded-xl border" placeholder="Categories (comma: money,people)" value={form.cats} onChange={e=>setForm({...form, cats:e.target.value})}/>
                <input className="px-3 py-2 rounded-xl border" placeholder="Note/register" value={form.note} onChange={e=>setForm({...form, note:e.target.value})}/>
              </div>
              <button onClick={add} className="px-4 py-2 rounded-xl bg-blue-600 text-white">Add</button>
            </div>

            <div className="rounded-2xl border bg-white p-5 shadow space-y-3">
              <div className="font-semibold">Export / Import / Reset</div>
              <div className="flex flex-wrap gap-2">
                <button onClick={exportJSON} className="px-4 py-2 rounded-xl border bg-gray-50">Export JSON</button>
                <label className="px-4 py-2 rounded-xl border bg-gray-50 cursor-pointer">
                  Import JSON
                  <input type="file" accept="application/json" className="hidden" onChange={e=>importJSON(e.target.files[0])}/>
                </label>
                <button onClick={resetDB} className="px-4 py-2 rounded-xl border bg-red-50 text-red-700">Reset DB</button>
              </div>
              <div className="text-xs text-gray-500">Tip: Export before resetting. The file is saved locally on your device.</div>
            </div>

            <div>
              <div className="font-semibold mb-2">Cards (quick view)</div>
              <div className="max-h-64 overflow-auto border rounded-xl">
                <table className="min-w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="text-left p-2">ES</th>
                      <th className="text-left p-2">EN</th>
                      <th className="text-left p-2">Cats</th>
                      <th className="text-left p-2">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {list.map(row => (
                      <tr key={row.id} className="border-t">
                        <td className="p-2">{row.es}</td>
                        <td className="p-2">{row.en}</td>
                        <td className="p-2">{(row.cats||[]).join(', ')}</td>
                        <td className="p-2">
                          <button onClick={()=>del(row.id)} className="px-2 py-1 rounded-lg border bg-red-50">Delete</button>
                        </td>
                      </tr>
                    ))}
                    {!list.length && <tr><td className="p-3 text-gray-500" colSpan="4">No cards yet.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      // ---- Stats ----
      function StatsTab(){
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        const [summary, setSummary] = useState({ days:[], reviews:[], news:[], easeAvg:0 });

        const compute = async () => {
          const logs = await db.logs.toArray();
          // group by date (last 14 days)
          const map = new Map();
          const toDay = (ts)=> new Date(new Date(ts).toDateString()).getTime();
          const today = toDay(Date.now());
          for (let i=13;i>=0;i--){ map.set(today - i*86400000, { review:0, startLearning:0 }); }
          logs.forEach(l => {
            const d = toDay(l.ts);
            if (!map.has(d)) return;
            if (l.action==='review') map.get(d).review += 1;
            if (l.action==='startLearning') map.get(d).startLearning += 1;
          });
          const days = [...map.keys()].sort((a,b)=>a-b).map(ts=> new Date(ts).toLocaleDateString());
          const reviews = [...map.values()].map(v=>v.review);
          const news = [...map.values()].map(v=>v.startLearning);

          // average ease across deck
          const srs = await db.srs.toArray();
          const avg = srs.length ? (srs.reduce((a,b)=>a+(b.ease||2.5),0)/srs.length) : 0;

          setSummary({ days, reviews, news, easeAvg: avg });
        };

        useEffect(()=>{ compute(); }, []);
        useEffect(()=>{
          if (!canvasRef.current) return;
          if (chartRef.current) { chartRef.current.destroy(); }
          const ctx = canvasRef.current.getContext('2d');
          chartRef.current = new Chart(ctx, {
            type: 'line',
            data: {
              labels: summary.days,
              datasets: [
                { label: 'Reviews', data: summary.reviews, tension: 0.3 },
                { label: 'New started', data: summary.news, tension: 0.3 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } },
              scales: { y: { beginAtZero: true } }
            }
          });
        }, [summary]);

        return (
          <div className="space-y-4">
            <div className="rounded-2xl border bg-white p-4 shadow">
              <div className="text-sm text-gray-500">Average deck ease</div>
              <div className="text-2xl font-semibold">{summary.easeAvg.toFixed(2)}</div>
            </div>

            <div className="rounded-2xl border bg-white p-4 shadow h-64">
              <div className="text-sm text-gray-500 mb-2">Activity (last 14 days)</div>
              <canvas ref={canvasRef}></canvas>
            </div>

            <div className="text-xs text-gray-500">Metrics are stored locally (they never leave your browser).</div>
          </div>
        );
      }

      function App(){
        const [ready, setReady] = useState(false);
        const [activeCats, setActiveCats] = useLocalStorage('lunf_cats', CATS.map(c=>c.id));
        const [tab, setTab] = useLocalStorage('lunf_tab', 'study'); // 'study' | 'browse' | 'manage' | 'stats'

        useEffect(()=>{ (async()=>{ await seedIfNeeded(); setReady(true); })(); }, []);
        useEffect(()=>{ if('speechSynthesis' in window) window.speechSynthesis.getVoices(); }, []);

        if (!ready) return <div className="max-w-6xl mx-auto p-6">Loading…</div>;

        return (
          <div className="max-w-6xl mx-auto space-y-6">
            <header className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <h1 className="text-2xl md:text-3xl font-bold">🇦🇷 Lunfardo Flashcards — SRS + Categories + Stats</h1>
              <div className="flex flex-wrap gap-2">
                <button onClick={()=>setTab('study')}  className={`px-3 py-2 rounded-xl border ${tab==='study'?'bg-blue-600 text-white':'bg-gray-100'}`}>Study</button>
                <button onClick={()=>setTab('browse')} className={`px-3 py-2 rounded-xl border ${tab==='browse'?'bg-blue-600 text-white':'bg-gray-100'}`}>Browse</button>
                <button onClick={()=>setTab('manage')} className={`px-3 py-2 rounded-xl border ${tab==='manage'?'bg-blue-600 text-white':'bg-gray-100'}`}>Manage</button>
                <button onClick={()=>setTab('stats')}  className={`px-3 py-2 rounded-xl border ${tab==='stats'?'bg-blue-600 text-white':'bg-gray-100'}`}>Stats</button>
              </div>
            </header>

            <section className="rounded-2xl border bg-white p-4 md:p-6 shadow">
              <div className="text-sm text-gray-500 mb-1">Filter by categories</div>
              <CategoryBar activeCats={activeCats} setActiveCats={setActiveCats} />
            </section>

            {tab === 'study'  && <StudyTab  activeCats={activeCats} />}
            {tab === 'browse' && <BrowseTab activeCats={activeCats} />}
            {tab === 'manage' && <ManageTab onChange={()=>{}} />}
            {tab === 'stats'  && <StatsTab />}

            <footer className="text-xs text-gray-500">Local DB: IndexedDB (Dexie). SRS: simplified SM‑2 + learning steps. Works offline.</footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
